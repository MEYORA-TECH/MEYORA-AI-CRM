[project]
name = "meyora-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "UP046"]  # FastAPI Depends() in defaults; Generic[] kept for pydantic clarity

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/ai/prompts.py" = ["E501"]
"app/ai/tools/crm.py" = ["E501"]  # one-line summaries the model reads
"app/ai/memory.py" = ["E501"]
"app/ai/tools/email_tools.py" = ["E501"]
"app/ai/tools/web_tools.py" = ["E501"]
"app/services/web_research.py" = ["E501"]  # prompt text
"app/ai/actions/*" = ["E501"]
"app/ai/summaries.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
